services:
  postgres:
    image: postgres:16-alpine
    container_name: findoc-rag-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-my_postgre_password}
      - POSTGRES_DB=${POSTGRES_DB:-findoc_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-findoc_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findoc-rag-app
    restart: unless-stopped
    network_mode: host
    environment:
      - APP_NAME=FinDoc-RAG
      - APP_ENV=production
      - DEBUG=False
      - LOG_LEVEL=INFO
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:3b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - RERANKER_MODEL=${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:my_postgre_password@127.0.0.1:5432/findoc_rag}
      - VECTOR_STORE_PATH=/app/data/vector_store
      - RAW_DATA_PATH=/app/data/raw
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      - RATE_LIMITING_ENABLED=${RATE_LIMITING_ENABLED:-True}
      - RATE_LIMIT_CHAT=${RATE_LIMIT_CHAT:-30/minute}
      - RATE_LIMIT_UPLOAD=${RATE_LIMIT_UPLOAD:-10/minute}
      - RATE_LIMIT_DELETE=${RATE_LIMIT_DELETE:-10/minute}
      - TOP_K=10
      - FINAL_CONTEXT_K=3
    volumes:
      - ./data/raw:/app/data/raw
      - ./data/vector_store:/app/data/vector_store
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: findoc-rag-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
    depends_on:
      - app


volumes:
  postgres_data:
    driver: local
